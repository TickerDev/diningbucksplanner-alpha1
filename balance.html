<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Balance | Your Dining Bucks Planner</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="stylesheet" href="css/balance.css" />
  <!-- Loads the Plain runtime, which exposes the global Plain object. -->
  <script src="vendor/plain.js" defer></script>
  <!-- Starts Plain.createApp() and supplies shared state and navigation settings. -->
  <script src="js/app.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.5.1" defer></script>
  <script src="js/balance.js" defer></script>

</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <!--
      Plain registers this tag using the native Web Components API,
      supported by all major modern browsers. The browser's connectedCallback()
      triggers initialization; Plain loads navbar.html and navbar.js, then
      inserts the HTML and connects its bindings. File loading and bindings
      are Plain features built on the browser standard.
    -->
  <!-- The page attribute binds the app's currentPage value to the component's page prop. -->
  <!-- Plain updates the prop automatically whenever currentPage changes. -->
  <navbar-component page="{{currentPage}}"></navbar-component>
  <main id="main-content" tabindex="-1">
    <div class="page-placeholder">
      <h1>{{currentPage}}</h1> <!-- Plain inserts currentPage as text and updates it when the value changes. -->
      <template data-if="signedIn">
        <p>Signed in for this visit.</p>
      </template>
      <p>You’re viewing sample balance and spending data.</p>
      <p>Sample spending target: 10.50 Dining Bucks per day.</p>
      <div class="balance-charts">
        <section class="balance-chart">
          <h2>Last Week</h2>
          <p id="last-week-summary"></p>
          <canvas id="last-week" role="img" aria-labelledby="last-week-summary"></canvas>
        </section>
        <section class="balance-chart">
          <h2>This Week</h2>
          <p id="this-week-summary"></p>
          <canvas id="this-week" role="img" aria-labelledby="this-week-summary"></canvas>
        </section>
      </div>
      <section>
        <h2>Dining Suggestions</h2>
        <div class="balance-suggestions">
          <figure>
            <img src="assets/grilledcheese.jpg" alt="" />
            <figcaption>Grilled Cheese at 23 at Sneed</figcaption>
          </figure>
          <figure>
            <img src="assets/macandcheese.jpg" alt="" />
            <figcaption>Mac &amp; Cheese at The Commons</figcaption>
          </figure>
          <figure>
            <img src="assets/quesadilla.jpg" alt="" />
            <figcaption>Quesadilla at Sam’s Place</figcaption>
          </figure>
        </div>
      </section>
    </div>
  </main>
  <!-- Loads components/footer.html and footer.js, passing the same current-page value. -->
  <footer-component page="{{currentPage}}"></footer-component>
</body>

</html>
