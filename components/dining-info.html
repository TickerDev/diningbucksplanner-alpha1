<section class="dining-info" aria-labelledby="dining-heading">
  <template data-if="props.view === 'location'">
    <a class="dining-back" href="dining-info.html">All dining locations</a>
    <h1 id="dining-heading">((selected ? selected.name : 'Dining Location'))</h1>
  </template>
  <template data-else>
    <h1 id="dining-heading">Campus Dining Locations</h1>
  </template>
  <p class="resource-status" role="status">
    <template data-if="dining.initialPending">Loading campus dining…</template>
    <template data-if="dining.error">Campus dining could not load.</template>
    <template data-if="dining.value && dining.value.stale">Some dining information may be out of date.</template>
    <template data-if="dining.value && props.view === 'directory' && locations.length === 0">No dining locations are listed.</template>
    <template data-if="dining.value && props.view === 'location' && !selected">This dining location could not be found.</template>
  </p>
  <template data-if="dining.initialPending">
    <loading-skeleton-component></loading-skeleton-component>
  </template>
  <template data-if="dining.error">
    <button class="button" type="button" data-on:click="retry">Retry dining locations</button>
  </template>

  <template data-if="props.view === 'directory'">
    <template data-if="locations.length">
      <div class="dining-filters" role="group" aria-label="Filter dining locations">
        <form-field-component>
          <label for="dining-search">Search locations</label>
          <input id="dining-search" class="control" type="search" placeholder="Restaurant or building" data-model="search" />
        </form-field-component>
        <form-field-component>
          <label for="dining-building">Campus building</label>
          <select id="dining-building" class="control" data-model="buildingFilter">
            <option value="">All buildings</option>
            <template data-for="building in buildings" data-key="building">
              <option data-bind:value="building">{{building}}</option>
            </template>
          </select>
        </form-field-component>
        <label class="dining-open-filter"><input type="checkbox" data-model="openOnly" /> Scheduled open now</label>
      </div>
      <p class="resource-status dining-result-count" role="status">((filteredLocations.length === 1 ? '1 location' : filteredLocations.length + ' locations'))</p>
      <template data-if="!filteredLocations.length">
        <p class="dining-no-results">No locations match these filters. <button class="button" type="button" data-on:click="clearFilters">Clear filters</button></p>
      </template>
      <ul class="dining-locations-list rule-section" role="list">
        <template data-for="location in filteredLocations" data-key="location.id">
          <li class="dining-location-item">
            <a class="dining-location-link" data-bind:href="location.href">
              <span class="dining-thumbnail" aria-hidden="true">
                <span class="dining-image-fallback">No image</span>
                <template data-if="location.image">
                  <img class="dining-thumbnail-photo" data-bind:src="location.image" data-on:error="hideFailedImage" alt="" loading="lazy" width="80" height="56" />
                </template>
              </span>
              <span class="pill-text-wrap">
                <span class="pill-location-name">{{location.name}}</span>
                <span class="pill-building-name">{{location.building}}</span>
                <span class="dining-directory-meta">
                  <span class="dining-status" data-bind:data-status="location.status.state">{{location.status.label}}</span>
                  <span class="dining-directory-price">((location.price === 'Price unavailable' ? location.price : 'Lowest listed item ' + location.price))</span>
                </span>
              </span>
              <img class="icon dining-directory-arrow" src="assets/lucide/chevron-right.svg" alt="" />
            </a>
          </li>
        </template>
      </ul>
    </template>
    <div class="ttu-emblem-wrap">
      <img src="assets/dbl__T.svg" class="ttu-double-t" alt="Texas Tech Red Raiders Double T logo" width="859" height="1007" />
    </div>
  </template>

  <template data-if="props.view === 'location' && selected">
    <div class="dining-layout">
      <article class="dining-hours-card" aria-label="Hours and menus for {{selected.name}}">
        <p><span class="dining-status dining-status-current" data-bind:data-status="selected.status.state">{{selected.status.label}}</span></p>
        <template data-if="selected.weeklyHours.length">
          <table class="hours-schedule-table">
            <caption>Regular hours (Central Time)</caption>
            <tbody>
              <template data-for="day in selected.weeklyHours" data-key="day.day">
                <tr><th scope="row">{{day.day}}</th><td>{{day.label}}</td></tr>
              </template>
            </tbody>
          </table>
        </template>
        <template data-else>
          <p>Regular hours are unavailable.</p>
        </template>

        <template data-if="selected.upcomingHours.length">
          <h2 id="dated-hours-heading">Dated hours</h2>
          <table class="hours-schedule-table dated-hours-table" aria-labelledby="dated-hours-heading">
            <thead>
              <tr>
                <th scope="col">Date</th>
                <th scope="col">Schedule</th>
                <th scope="col">Hours</th>
              </tr>
            </thead>
            <tbody>
              <template data-for="record in selected.upcomingHours" data-key="record.date">
                <tr data-bind:data-today="record.isToday ? 'true' : null">
                  <th scope="row"><time data-bind:datetime="record.date">{{record.formattedDate}}</time>
                    <template data-if="record.isToday"><span class="dining-today-label">Today</span></template>
                  </th>
                  <td>{{record.title}}</td>
                  <td>{{record.label}}</td>
                </tr>
              </template>
            </tbody>
          </table>
        </template>
        <template data-if="selected.hoursSource">
          <p><a data-bind:href="selected.hoursSource.url">TTU dining hours</a></p>
        </template>

        <template data-if="selected.mealRates">
          <h2>Published meal rates</h2>
          <ul>
            <template data-for="rate, index in selected.mealRates" data-key="index">
              <li>{{rate.service}} · {{rate.diningBucks}} · Guest {{rate.guestRate}}</li>
            </template>
          </ul>
        </template>
        <template data-if="selected.menus">
          <h2>Menus</h2>
          <template data-for="menu in selected.menus" data-key="menu.url">
            <details>
              <summary>((menu.title ?? 'Published menu'))</summary>
              <ul class="dining-menu-items">
                <template data-for="item in menu.items" data-key="item.id">
                  <li>
                    <div class="dining-menu-item-heading">
                      <strong>{{item.name}}</strong>
                      <span class="dining-menu-price">((item.price ?? 'Price unavailable'))</span>
                    </div>
                    <span>((item.section ? item.section + ' · ' : '')){{item.category}}</span>
                    <template data-if="item.days"><span>{{item.days}}</span></template>
                    <template data-if="item.rotation"><span>{{item.rotation}}</span></template>
                    <template data-if="item.allergens"><span>Published allergen or dietary information: {{item.allergens}}</span></template>
                    <template data-for="link in item.links" data-key="link.key">
                      <a data-bind:href="link.href">{{link.label}}</a>
                    </template>
                  </li>
                </template>
              </ul>
            </details>
          </template>
        </template>
        <template data-else>
          <p>Menu items and prices are unavailable.</p>
        </template>
        <template data-if="selected.externalLinks">
          <ul>
            <template data-for="link in selected.externalLinks" data-key="link.url">
              <li><a data-bind:href="link.url">{{link.label}}</a></li>
            </template>
          </ul>
        </template>
      </article>
      <aside class="dining-col-right rule-section" aria-label="Dining location details">
        <section>
          <h2>About this location</h2>
          <template data-if="selected.image">
            <figure class="dining-location-figure">
              <div class="dining-location-media">
                <span class="dining-image-fallback" aria-hidden="true">Image unavailable</span>
                <img class="dining-location-img" data-bind:src="selected.image" data-on:error="hideFailedImage" alt="" />
              </div>
              <figcaption>{{selected.building}}</figcaption>
            </figure>
          </template>
          <template data-else>
            <p class="pill-building-name">{{selected.building}}</p>
          </template>
          <template data-if="selected.description">
            <p><span id="location-description">((descriptionExpanded ? selected.description : selected.descriptionPreview))</span><template data-if="selected.hasMoreDescription">
              <a class="dining-description-toggle" href="#location-description"
                aria-controls="location-description"
                data-bind:aria-expanded="descriptionExpanded ? 'true' : 'false'"
                data-bind:aria-label="descriptionExpanded ? 'Read less about this location' : 'Read more about this location'"
                data-on:click.prevent="toggleDescription">((descriptionExpanded ? 'Read Less' : 'Read More'))</a>
            </template></p>
          </template>
          <iframe class="dining-map" data-bind:src="selected.mapEmbedUrl"
            title="Google Maps for {{selected.name}}" loading="lazy"
            width="400" height="264" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
          <p><a data-bind:href="selected.mapsUrl" target="_blank" rel="noopener noreferrer">Open in Google Maps</a></p>
          <template data-if="selected.page">
            <p><a data-bind:href="selected.page">TTU location information</a></p>
          </template>
        </section>
        <div class="ttu-emblem-wrap">
          <img src="assets/dbl__T.svg" class="ttu-double-t" alt="Texas Tech Red Raiders Double T logo" width="859" height="1007" />
        </div>
      </aside>
    </div>
  </template>
</section>
