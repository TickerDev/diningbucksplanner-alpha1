<section class="login-content rule-section signup-content" aria-labelledby="signup-heading">
  <h1 id="signup-heading">Welcome</h1>
  <p class="login-intro">Account registration is unavailable in this demo.</p>
  <form class="login-form">
    <form-field-component class="login-field">
      <label for="signup-email">Email</label>
      <input
        id="signup-email"
        name="email"
        class="control" type="email"
        autocomplete="email"
        placeholder="Email here..."
        disabled
      />
    </form-field-component>
    <form-field-component class="login-field">
      <label for="signup-password">Password</label>
      <input
        id="signup-password"
        name="password"
        class="control" type="password"
        autocomplete="new-password"
        placeholder="We won’t look, promise!"
        disabled
      />
    </form-field-component>
    <button class="login-button login-submit button button-primary" type="submit" disabled>Sign Up</button>
    <button class="login-button eraider-button button" type="button" disabled>
      <img src="assets/login/eraider.png" width="17" height="20" alt="" />
      <span>Continue with eRaider</span>
    </button>
  </form>
  <div class="signup-divider">
    <img src="assets/signup/login-divider.svg" alt="" aria-hidden="true" />
    <span>Been here before?</span>
  </div>
  <a class="login-button signup-login-link button" href="login.html">Login</a>
</section>
