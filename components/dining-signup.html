<section class="login-content signup-content" aria-labelledby="signup-heading">
  <h1 id="signup-heading">Welcome</h1>
  <p class="login-intro">Let’s get you started...</p>
  <form class="login-form">
    <div class="login-field">
      <label for="signup-email">Email</label>
      <input
        id="signup-email"
        name="email"
        type="email"
        autocomplete="email"
        placeholder="Email here..."
        required
      />
    </div>
    <div class="login-field">
      <label for="signup-password">Password</label>
      <input
        id="signup-password"
        name="password"
        type="password"
        autocomplete="new-password"
        placeholder="We won’t look, promise!"
        required
      />
    </div>
    <button class="login-button login-submit" type="submit">Sign Up</button>
    <button class="login-button eraider-button" type="button">
      <img src="assets/login/eraider.png" width="17" height="20" alt="" />
      <span>Continue with eRaider</span>
    </button>
  </form>
  <div class="signup-divider">
    <img src="assets/signup/login-divider.svg" alt="" aria-hidden="true" />
    <span>Been here before?</span>
  </div>
  <a class="login-button signup-login-link" href="login.html">Login</a>
</section>
