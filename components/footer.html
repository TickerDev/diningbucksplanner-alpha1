<!-- Standard HTML loads the footer's stylesheet when Plain inserts this template. -->
<link rel="stylesheet" href="css/footer.css" />

<footer class="site-footer">
  <div class="shell-width footer-inner">
    <a class="footer-brand" href="index.html">Your Dining Bucks Planner</a>
    <nav class="footer-nav" aria-label="Footer navigation">
      <template data-for="item in settings.navigation" data-key="item.id">
        <a
          data-bind:href="item.href"
          data-bind:aria-current="(props.page === item.label || (props.page === 'Sign Up' && item.id === 'login')) ? 'page' : null"
        >
          {{item.label}}
        </a>
      </template>
    </nav>
  </div>
</footer>
