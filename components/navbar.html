<!--
  Plain loads this template when it finds <navbar-component> on the page.
  By convention, it also loads components/navbar.js for this component's behavior.
  The header, nav, links, and CSS classes below are ordinary HTML.
-->
<!-- Standard HTML loads this component's CSS; Plain does not automatically load a sibling CSS file. -->
<!-- Plain uses light DOM here, so the stylesheet applies to the page rather than being isolated to this component. -->
<link rel="stylesheet" href="css/navbar.css" />
<header class="site-header" id="page-top">
  <div class="shell-width header-inner">
    <p class="header-breadcrumb">
      <a href="index.html">Your Dining Bucks Planner</a>
      <span aria-hidden="true">&gt;</span>
      <span>{{props.page}}</span> <!-- Plain inserts the page prop as text and updates it when the prop changes. -->
    </p>
    <nav class="primary-nav" aria-label="Main navigation">
      <!-- settings.navigation is the shared list of links supplied in js/app.js. -->
      <!-- data-for repeats this template once for each link, naming the current link "item". -->
      <!-- data-key gives each repeated link a stable identity so Plain can reuse its DOM node when the list changes. -->
      <template data-for="item in settings.navigation" data-key="item.id">
        <!-- data-bind:href sets the normal href attribute from the current item's URL. -->
        <!-- data-bind:aria-current sets "page" for the selected link; null removes the attribute from other links. -->
        <!-- The comparison below is a Plain template expression -->
        <a
          class="nav-link"
          data-bind:href="item.href"
          data-bind:aria-current="props.page === item.label ? 'page' : null"
        >
          {{item.label}} <!-- Plain inserts the current item's label as text, rather than treating it as HTML. -->
        </a>
      </template>
    </nav>
    <a class="profile-link" href="login.html" aria-label="Go to login">
      <img src="assets/profile-placeholder.svg" width="38" height="39" alt="" />
    </a>
  </div>
  <hr class="header-divider" aria-hidden="true" />
</header>
