<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | Your Dining Bucks Planner</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="preload" href="components/navbar.html" as="fetch" crossorigin />
    <link rel="stylesheet" href="css/index.css" />
    <!-- Loads the Plain runtime, which exposes the global Plain object. -->
    <script src="vendor/plain.js" defer></script>
    <!-- Starts Plain.createApp() and supplies shared state and navigation settings. -->
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <!--
      Plain registers this tag using the native Web Components API,
      supported by all major modern browsers. The browser's connectedCallback()
      triggers initialization; Plain loads navbar.html and navbar.js, then
      inserts the HTML and connects its bindings. File loading and bindings
      are Plain features built on the browser standard.
    -->
    <!-- The page attribute binds the app's currentPage value to the component's page prop. -->
    <!-- Plain updates the prop automatically whenever currentPage changes. -->
    <navbar-component page="{{currentPage}}"></navbar-component>
    <main id="main-content" class="home-dashboard" tabindex="-1">
      <page-heading-component title="Dining Bucks overview" description="Compare campus dining and project spending over 112 days."></page-heading-component>
      <div class="home-grid">
        <section class="col-left" aria-label="Campus dining and nutrition">
          <dining-comparison-component></dining-comparison-component>
        </section>
        <section class="col-right chart-card" aria-labelledby="projection-heading">
          <h2 id="projection-heading">Dining Bucks Projection</h2>
          <div class="chart-field-grid">
            <div class="figma-input-group">
              <label class="figma-input-label budget-label" for="dining-budget">Budget</label>
              <input type="number" id="dining-budget" class="control figma-input-field" placeholder="2200" min="0" step="0.01" />
            </div>
            <div class="figma-input-group">
              <label class="figma-input-label planned-spending-label" for="planned-spending">Planned Spending Per Day</label>
              <input type="number" id="planned-spending" class="control figma-input-field" placeholder="8" min="0" step="0.01" />
            </div>
          </div>

          <div class="chart-svg-wrap">
            <p class="chart-gauge-label">Balance <span id="label-max-budget">$2,200</span></p>
            <svg id="spending-chart" viewBox="4 6 351 223" role="img" aria-labelledby="chart-title chart-description">
              <title id="chart-title">Projected spending over 112 days</title>
              <desc id="chart-description">Spending starts at zero. The dashed line represents the pace that uses the budget evenly over the semester. The gauge shows the share of the budget projected to be spent.</desc>
              <line class="chart-grid-line" x1="55" y1="20" x2="330" y2="20" />
              <line class="chart-grid-line" x1="55" y1="65" x2="330" y2="65" />
              <line class="chart-grid-line" x1="55" y1="110" x2="330" y2="110" />
              <line class="chart-grid-line" x1="55" y1="155" x2="330" y2="155" />
              <rect class="chart-gauge" x="25" y="20" width="14" height="170" />
              <rect id="gauge-spent-fill" x="25" y="190" width="14" height="0" />
              <text x="32" y="206" text-anchor="middle">$0</text>
              <line class="chart-axis" x1="55" y1="190" x2="330" y2="190" />
              <line class="chart-axis" x1="55" y1="20" x2="55" y2="190" />
              <line id="line-target" x1="55" y1="190" x2="330" y2="20" />
              <line id="line-projected" x1="55" y1="190" x2="330" y2="190" />
              <circle id="point-finish" cx="330" cy="190" r="4" />
              <text x="55" y="207" text-anchor="start">Day 0</text>
              <text x="192" y="207" text-anchor="middle">Day 56</text>
              <text x="330" y="207" text-anchor="end" id="label-end-day">Day 112</text>
              <text class="axis-label" x="192" y="224" text-anchor="middle">Semester Timeline (Days)</text>
            </svg>
            <div class="chart-legend"><span>Projected spending</span><span>Target pace</span></div>
          </div>
          <p id="status-tag-text" class="chart-status" role="status">Enter daily spend to project</p>
          <div class="chart-actions">
            <a class="planner-link button button-primary" href="planner.html"><img class="icon action-icon" src="assets/lucide/calendar-days.svg" alt="" />Open Planner</a>
            <a class="planner-link button" href="balance.html">View Balance</a>
          </div>
        </section>
      </div>
    </main>
    <!-- Loads components/footer.html and footer.js, passing the same current-page value. -->
    <footer-component page="{{currentPage}}"></footer-component>
  </body>
</html>
