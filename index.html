<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | Your Dining Bucks Planner</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="preload" href="components/navbar.html" as="fetch" crossorigin />
    <link rel="stylesheet" href="css/index.css" />
    <!-- Loads the Plain runtime, which exposes the global Plain object. -->
    <script src="vendor/plain.js" defer></script>
    <!-- Starts Plain.createApp() and supplies shared state and navigation settings. -->
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <!--
      Plain registers this tag using the native Web Components API,
      supported by all major modern browsers. The browser's connectedCallback()
      triggers initialization; Plain loads navbar.html and navbar.js, then
      inserts the HTML and connects its bindings. File loading and bindings
      are Plain features built on the browser standard.
    -->
    <!-- The page attribute binds the app's currentPage value to the component's page prop. -->
    <!-- Plain updates the prop automatically whenever currentPage changes. -->
    <navbar-component page="{{currentPage}}"></navbar-component>
    <main id="main-content" class="home-dashboard" tabindex="-1">
<section class="col-left">
    <dining-comparison-component></dining-comparison-component>
  </section>

  <!-- RIGHT COLUMN: Place inputs, planners, or budgets here -->
  <section class="col-right">
    <!-- Budget Input -->
    <div class="figma-input-group">
      <label
        class="figma-input-label budget-label"
        for="dining-budget"
      >
          Budget
      </label>
      <input
        type="number"
        id="dining-budget"
        class="figma-input-field"
        placeholder="2200" min="0" step="0.01"
      />
    </div>

    <!-- Planned Spending Input -->
    <div class="figma-input-group">
      <label
        class="figma-input-label planned-spending-label"
        for="planned-spending"
      >
        Planned Spending Per Day
      </label>
      <input
        type="number"
        id="planned-spending"
        class="figma-input-field"
        placeholder="8" min="0" step="0.01"
      />
    </div>

    <!-- Chart Card -->
  <div class="chart-card">
  <div class="chart-header">Dining Bucks Projection</div>
  <div class="chart-svg-wrap">
    <svg id="spending-chart" viewBox="0 0 360 220" preserveAspectRatio="none">
      <!-- Grid Lines -->
      <line x1="55" y1="20" x2="330" y2="20" stroke="#e0e0e0" stroke-dasharray="2,2" />
      <line x1="55" y1="65" x2="330" y2="65" stroke="#e0e0e0" stroke-dasharray="2,2" />
      <line x1="55" y1="110" x2="330" y2="110" stroke="#e0e0e0" stroke-dasharray="2,2" />
      <line x1="55" y1="155" x2="330" y2="155" stroke="#e0e0e0" stroke-dasharray="2,2" />

      <!-- Y-Axis Vertical Balance Bar (Thermometer) -->
      <!-- Background / Empty Gauge (Unspent Space) -->
      <rect x="25" y="20" width="14" height="170" fill="#E8F5E9" stroke="#000000" stroke-width="1" />
      <!-- Spent Fill Bar (Grows upward) -->
      <rect id="gauge-spent-fill" x="25" y="100" width="14" height="90" fill="#E95757" />
      <!-- Gauge Outline -->
      <rect x="25" y="20" width="14" height="170" fill="none" stroke="#000000" stroke-width="1.2" />

      <!-- Gauge Labels -->
      <text x="21" y="24" font-size="7" font-weight="bold" text-anchor="end" fill="#000" id="label-max-budget">$2,200</text>
      <text x="21" y="193" font-size="7" font-weight="bold" text-anchor="end" fill="#000">$0</text>
      <text x="32" y="15" font-size="6.5" font-weight="bold" text-anchor="middle" fill="#555">BALANCE</text>

      <!-- Plot Area Axes -->
      <!-- X-Axis Line -->
      <line x1="55" y1="190" x2="330" y2="190" stroke="#000000" stroke-width="1.5" />
      <!-- Y-Axis Line -->
      <line x1="55" y1="20" x2="55" y2="190" stroke="#000000" stroke-width="1.5" />

      <!-- Target Spending Pace Line (Dotted Baseline: Day 0 to End) -->
      <line id="line-target" x1="55" y1="190" x2="330" y2="20" stroke="#2E7D32" stroke-width="1.5" stroke-dasharray="4,3" />

      <!-- Projected User Spending Line -->
      <line id="line-projected" x1="55" y1="190" x2="280" y2="20" stroke="#D32F2F" stroke-width="2.2" />

      <!-- Depletion / Finish Point Marker -->
      <circle id="point-finish" cx="280" cy="20" r="4" fill="#D32F2F" stroke="#ffffff" stroke-width="1" />

      <!-- X-Axis Day Labels -->
      <text x="55" y="202" font-size="7" text-anchor="middle" fill="#000">Day 0</text>
      <text x="192" y="202" font-size="7" text-anchor="middle" fill="#000">Day 56</text>
      <text x="330" y="202" font-size="7" text-anchor="middle" fill="#000" id="label-end-day">Day 112</text>
      <text x="192" y="214" font-size="8" font-weight="bold" text-anchor="middle" fill="#000">Semester Timeline (Days)</text>

      <!-- Dynamic Status Callout Tag -->
      <rect id="status-tag-bg" x="190" y="28" width="130" height="18" fill="#FFFDE7" stroke="#000" stroke-width="0.8" />
      <text id="status-tag-text" x="255" y="40" font-size="7" font-weight="bold" text-anchor="middle" fill="#D32F2F">
        Runs out on Day 88!
      </text>
    </svg>
  </div>
</div>

<p>
  <a class="planner-link" href="planner.html">Open Planner</a>
  <a class="planner-link" href="balance.html">View Balance</a>
</p>
  </section>
    </main>
    <!-- Loads components/footer.html and footer.js, passing the same current-page value. -->
    <footer-component page="{{currentPage}}"></footer-component>
  </body>
</html>
