<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Home | Your Dining Bucks Planner</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="preload" href="components/navbar.html" as="fetch" crossorigin />
    <link rel="stylesheet" href="css/index.css" />
    <!-- Loads the Plain runtime, which exposes the global Plain object. -->
    <script src="vendor/plain.js" defer></script>
    <!-- Starts Plain.createApp() and supplies shared state and navigation settings. -->
    <script src="js/app.js" defer></script>
  </head>
  <body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    <!--
      Plain registers this tag using the native Web Components API,
      supported by all major modern browsers. The browser's connectedCallback()
      triggers initialization; Plain loads navbar.html and navbar.js, then
      inserts the HTML and connects its bindings. File loading and bindings
      are Plain features built on the browser standard.
    -->
    <!-- The page attribute binds the app's currentPage value to the component's page prop. -->
    <!-- Plain updates the prop automatically whenever currentPage changes. -->
    <navbar-component page="{{currentPage}}"></navbar-component>
    <main id="main-content" class="home-dashboard" tabindex="-1">
      <page-heading-component title="Dining Bucks overview"></page-heading-component>
      <section class="chart-card" aria-labelledby="projection-heading">
        <h2 id="projection-heading">Dining Bucks Projection</h2>
        <div class="projection-layout">
          <div class="chart-field-grid">
            <form-field-component>
              <label for="dining-budget">Budget ($)</label>
              <input type="number" id="dining-budget" class="control" value="2200" placeholder="2200" min="0" step="0.01" />
            </form-field-component>
            <form-field-component>
              <label for="planned-spending">Planned Spending Per Day ($)</label>
              <input type="number" id="planned-spending" class="control" value="8" placeholder="0" min="0" step="0.01" />
            </form-field-component>
          </div>

          <chart-frame-component class="projection-chart">
            <figure class="projection-figure" aria-labelledby="chart-title" aria-describedby="chart-description status-tag-text">
              <figcaption class="plot-caption">
                <span id="chart-title">Cumulative spending ($)</span>
                <span class="chart-gauge-label">Budget <strong id="label-max-budget">$2,200</strong></span>
              </figcaption>
              <p id="chart-description" class="sr-only">Projected spending over 112 days. The dashed line shows the pace that uses the budget evenly over the semester. The gauge shows the share of the budget projected to be spent.</p>
              <div class="plot-grid" aria-hidden="true">
                <div class="plot-y-axis">
                  <span id="budget-axis-max">$2,200</span>
                  <span id="budget-axis-mid">$1,100</span>
                  <span>$0</span>
                </div>
                <svg id="spending-chart" viewBox="18 20 312 170" preserveAspectRatio="none">
                  <line class="chart-grid-line" x1="55" y1="20" x2="330" y2="20" />
                  <line class="chart-grid-line" x1="55" y1="62.5" x2="330" y2="62.5" />
                  <line class="chart-grid-line" x1="55" y1="105" x2="330" y2="105" />
                  <line class="chart-grid-line" x1="55" y1="147.5" x2="330" y2="147.5" />
                  <rect class="chart-gauge" x="25" y="20" width="8" height="170" />
                  <rect id="gauge-spent-fill" x="25" y="190" width="8" height="0" />
                  <line class="chart-axis" x1="55" y1="190" x2="330" y2="190" />
                  <line class="chart-axis" x1="55" y1="20" x2="55" y2="190" />
                  <line id="line-target" x1="55" y1="190" x2="330" y2="20" />
                  <line id="line-projected" x1="55" y1="190" x2="330" y2="190" />
                  <line id="point-finish" x1="330" x2="330" y1="190" y2="190" />
                </svg>
                <div class="plot-x-axis">
                  <span>Day 0</span>
                  <span>Day 56</span>
                  <span id="label-end-day">Day 112</span>
                </div>
                <p class="plot-x-title">Semester timeline (days)</p>
              </div>
              <div class="chart-legend">
                <span class="legend-projected">Projected spending</span>
                <span class="legend-target">Target pace</span>
                <span class="legend-gauge">Budget used</span>
              </div>
            </figure>
          </chart-frame-component>

          <div class="projection-feedback">
            <p id="status-tag-text" class="chart-status" role="status">Enter daily spend to project</p>
            <div class="chart-actions">
              <a class="planner-link button button-primary" href="planner.html">Open Planner</a>
              <a class="planner-link button" href="balance.html">View Balance</a>
            </div>
          </div>
        </div>
      </section>
      <section class="home-dining" aria-label="Campus dining and nutrition">
        <dining-comparison-component></dining-comparison-component>
      </section>
    </main>
    <!-- Loads components/footer.html and footer.js, passing the same current-page value. -->
    <footer-component page="{{currentPage}}"></footer-component>
  </body>
</html>
