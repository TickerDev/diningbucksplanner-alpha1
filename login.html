<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Your Dining Bucks Planner</title>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap');

      :root {
        font-family: Inter, Arial, sans-serif;
        color-scheme: light;
        color: #000000;
        background: #ffffff;
        line-height: 1.5;
        --shell-black: #000000;
        --shell-red: #f00;
        --shell-white: #ffffff;
        --shell-line: #d9d9d9;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100svh;
        display: flex;
        flex-direction: column;
      }

      a {
        color: inherit;
        text-underline-offset: 4px;
      }

      a:focus-visible,
      main:focus-visible {
        outline: 2px solid var(--shell-red);
        outline-offset: 5px;
      }

      ::selection {
        color: var(--shell-white);
        background: #a30000;
      }

      .shell-width {
        width: min(100% - 64px, 1120px);
        margin-inline: auto;
      }

      .skip-link {
        position: fixed;
        top: 8px;
        left: 8px;
        z-index: 10;
        padding: 12px;
        background: #ffffff;
        transform: translateY(-150%);
        transition: transform 0.2s ease;
      }

      .skip-link:focus {
        transform: translateY(0);
      }

      /* Site Header & Navigation */
      .site-header {
        position: relative;
        color: var(--shell-white);
        background: var(--shell-black);
      }

      .site-header a:focus-visible {
        outline-color: var(--shell-white);
      }

      .header-inner {
        display: grid;
        grid-template-columns: 1fr 44px;
        grid-template-rows: auto auto;
        gap: 12px 24px;
        padding-block: 16px 15px;
      }

      .header-breadcrumb {
        margin: 0;
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px;
        font-size: 14px;
      }

      .header-breadcrumb a {
        text-decoration: none;
      }

      .header-breadcrumb a:hover {
        text-decoration: underline;
      }

      .primary-nav {
        grid-column: 1;
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }

      .nav-link {
        min-width: 100px;
        min-height: 44px;
        display: flex;
        align-items: center;
        padding: 10px 14px;
        color: var(--shell-white);
        background: var(--shell-red);
        font-size: 14px;
        text-decoration: none;
        transition: background-color 0.15s ease;
      }

      .nav-link:hover {
        background: #b80000;
      }

      .nav-link[aria-current='page'] {
        text-decoration: underline;
        text-decoration-thickness: 2px;
      }

      .profile-link {
        grid-column: 2;
        grid-row: 1 / 3;
        align-self: center;
        display: grid;
        place-items: center;
        min-width: 44px;
        min-height: 44px;
        border-radius: 50%;
      }

      .profile-link:hover {
        outline: 1px solid var(--shell-white);
      }

      .profile-link svg,
      .profile-link img {
        display: block;
      }

      .header-divider {
        height: 0;
        margin: 0;
        padding: 0;
        border: 0;
        border-top: 2px solid var(--shell-line);
      }

      /* Main Auth Page Layout */
      main {
        flex: 1;
        width: min(100% - 64px, 1120px);
        margin-inline: auto;
        min-height: 360px;
      }

      #main-content.auth-main {
        display: flex;
        flex-direction: column;
        justify-content: flex-start;
        align-items: center;
        padding: 44px 16px 64px;
        max-width: 440px;
      }

      .auth-card {
        width: 100%;
        max-width: 315px;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      .auth-hero {
        text-align: center;
        margin-bottom: 24px;
        width: 100%;
      }

      .auth-title {
        margin: 0 0 6px;
        font-size: 40px;
        font-weight: 700;
        line-height: 1.15;
        color: #000000;
        letter-spacing: -0.5px;
      }

      .auth-subtitle {
        margin: 0;
        font-size: 24px;
        font-weight: 400;
        line-height: 1.25;
        color: #000000;
      }

      .auth-form {
        width: 100%;
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .auth-field-group {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 4px;
        width: 100%;
      }

      .auth-label {
        font-size: 11px;
        font-weight: 400;
        color: #000000;
        line-height: 1.2;
      }

      .auth-input {
        width: 100%;
        height: 28px;
        padding: 4px 8px;
        background-color: #fafafa;
        border: 1px solid #000000;
        border-radius: 2px;
        font-size: 11px;
        font-family: inherit;
        color: #000000;
        outline: none;
      }

      .auth-input::placeholder {
        color: #a2a2a2;
      }

      .auth-input:focus {
        background-color: #ffffff;
        outline: 2px solid var(--shell-red);
        outline-offset: 1px;
      }

      .auth-actions {
        display: flex;
        flex-direction: column;
        gap: 10px;
        width: 100%;
        margin-top: 6px;
      }

      .auth-btn {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        width: 100%;
        height: 30px;
        padding: 4px 12px;
        background-color: #fafafa;
        border: 1px solid #000000;
        border-radius: 2px;
        font-size: 12px;
        font-family: inherit;
        color: #000000;
        text-decoration: none;
        cursor: pointer;
        transition: background-color 0.15s ease;
      }

      .auth-btn:hover {
        background-color: #f0f0f0;
      }

      .auth-btn:focus-visible {
        outline: 2px solid var(--shell-red);
        outline-offset: 2px;
      }

      .auth-btn-eraider .eraider-logo {
        width: 17px;
        height: auto;
        max-height: 20px;
        object-fit: contain;
        display: inline-block;
        vertical-align: middle;
      }

      .auth-divider {
        position: relative;
        display: flex;
        align-items: center;
        justify-content: center;
        width: 100%;
        margin: 10px 0;
      }

      .auth-divider::before {
        content: "";
        position: absolute;
        left: 0;
        right: 0;
        top: 50%;
        height: 1px;
        background-color: #000000;
      }

      .auth-divider-text {
        position: relative;
        background-color: #ffffff;
        padding: 0 10px;
        font-size: 10px;
        color: #000000;
        line-height: 1;
      }

      /* Site Footer */
      .site-footer {
        margin-top: auto;
        border-top: 1px solid var(--shell-line);
        background: var(--shell-white);
      }

      .footer-inner {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: space-between;
        gap: 16px 24px;
        padding-block: 24px 28px;
      }

      .footer-brand {
        font-size: 14px;
        text-decoration: none;
        font-weight: 500;
      }

      .footer-brand:hover {
        text-decoration: underline;
      }

      .footer-nav {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        font-size: 14px;
      }

      .footer-nav a {
        text-decoration: none;
        color: #333333;
      }

      .footer-nav a:hover {
        text-decoration: underline;
      }

      .footer-nav a[aria-current='page'] {
        font-weight: 600;
        color: #000000;
        text-decoration: underline;
      }

      /* Responsive adjustments */
      @media (max-width: 640px) {
        .shell-width,
        main {
          width: calc(100% - 32px);
        }
        .header-inner {
          grid-template-columns: 1fr 44px;
          gap: 12px 8px;
        }
        .header-breadcrumb {
          font-size: 12px;
          gap: 5px;
        }
        .profile-link {
          grid-row: 1;
        }
        .primary-nav {
          grid-column: 1 / -1;
          display: grid;
          grid-template-columns: repeat(5, minmax(0, 1fr));
          gap: 6px;
        }
        .nav-link {
          min-width: 0;
          justify-content: center;
          padding: 8px 4px;
          font-size: 11px;
        }
        .footer-inner {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>

    <a class="skip-link" href="#main-content">Skip to content</a>

    <!-- Site Header & Navigation Bar -->
    <header class="site-header" id="page-top">
      <div class="shell-width header-inner">
        <p class="header-breadcrumb">
          <a href="index.html">Your Dining Bucks Planner</a>
          <span aria-hidden="true">&gt;</span>
          <span>Login</span>
        </p>

        <nav class="primary-nav" aria-label="Main navigation">
          <a class="nav-link" href="login.html" aria-current="page">Login</a>
          <a class="nav-link" href="index.html">Home</a>
          <a class="nav-link" href="balance.html">Balance</a>
          <a class="nav-link" href="planner.html">Planner</a>
          <a class="nav-link" href="dining-info.html">Dining Info</a>
        </nav>

        <a class="profile-link" href="login.html" aria-label="Go to login">
          <svg preserveAspectRatio="none" overflow="visible" width="38" height="39" viewBox="0 0 38 39" fill="none" xmlns="http://www.w3.org/2000/svg">

          </svg>
        </a>
      </div>
      <hr class="header-divider" aria-hidden="true" />
    </header>

    <!-- Main Content Area: Login Card -->
    <main id="main-content" class="auth-main" tabindex="-1">
      <section class="auth-card" aria-labelledby="login-title">
        <header class="auth-hero">
          <h1 id="login-title" class="auth-title">Welcome Back!</h1>
          <p class="auth-subtitle">Let’s get you started...</p>
        </header>

        <form class="auth-form" method="post" action="#" data-on:submit.prevent="login" novalidate>
          <div class="auth-field-group">
            <label for="login-email" class="auth-label">Email</label>
            <input
              type="email"
              id="login-email"
              name="email"
              class="auth-input"
              placeholder="Email here..."
              required
              data-model="email"
              autocomplete="email"
            />
          </div>

          <div class="auth-field-group">
            <label for="login-password" class="auth-label">Password</label>
            <input
              type="password"
              id="login-password"
              name="password"
              class="auth-input"
              placeholder="We won’t look, promise!"
              required
              data-model="password"
              autocomplete="current-password"
            />
          </div>

          <div class="auth-actions">
            <button type="submit" class="auth-btn auth-btn-submit">
              Login
