<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planner | Your Dining Bucks Planner</title>
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/planner.css" />
    <link rel="stylesheet" href="css/navbar.css" />
    <link rel="stylesheet" href="css/footer.css" />
    <link rel="preload" href="components/navbar.html" as="fetch" crossorigin />
    <script src="vendor/plain.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/planner.js" defer></script>
  </head>
  <body class="planner-page">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <navbar-component page="{{currentPage}}"></navbar-component>

    <main id="main-content" tabindex="-1">
      <page-heading-component title="Planner"></page-heading-component>
      <section class="planner-overview" aria-label="Planner budget controls">
        <form-field-component class="budget-input-group">
          <label for="planner-budget">Enter Budget: $</label>
          <input
            type="number"
            id="planner-budget"
            name="budget"
            class="budget-input-field control"
            placeholder="0.00"
            value=""
            min="0"
            step="0.01"
          />
        </form-field-component>
        <financial-statistics-component>
          <div class="budget-metrics-banner" id="budget-metrics" role="region" aria-label="Budget summary">
            <div class="metric-item">
              <span class="metric-label">Daily Avg:</span>
              <span class="metric-value" id="val-daily-avg">$0.00 / day</span>
            </div>
            <div class="metric-item">
              <span class="metric-label">Total Spent:</span>
              <span class="metric-value" id="val-total-spent">$0.00</span>
            </div>
            <div class="metric-item">
              <span class="metric-label">Remaining:</span>
              <span class="metric-value" id="val-remaining">$0.00</span>
            </div>
          </div>
        </financial-statistics-component>
        <div class="overall-budget-wrap rule-section">
          <span>Overall budget</span>
          <span class="overall-swatch neutral" id="overall-swatch" aria-label="Overall budget indicator"></span>
          <span class="overall-status-text" id="overall-status-text" role="status">Enter budget to track</span>
        </div>
      </section>
      <div class="planner-workspace">
        <section class="planner-calendar" aria-label="Interactive Calendar Planner">
          <calendar-frame-component>
            <!-- Month & Year Selectors -->
            <div class="calendar-header">
              <div class="calendar-select-group">
                <select id="calendar-month" class="calendar-select control" aria-label="Select month">
                  <option value="0">Jan</option>
                  <option value="1">Feb</option>
                  <option value="2">Mar</option>
                  <option value="3">Apr</option>
                  <option value="4">May</option>
                  <option value="5">Jun</option>
                  <option value="6">Jul</option>
                  <option value="7">Aug</option>
                  <option value="8">Sep</option>
                  <option value="9">Oct</option>
                  <option value="10">Nov</option>
                  <option value="11">Dec</option>
                </select>

                <select id="calendar-year" class="calendar-select control" aria-label="Select year">
                </select>
              </div>
              <div class="calendar-footer-nav">
                <button type="button" class="month-nav-link button" id="btn-prev-month">Previous month</button>
                <button type="button" class="month-nav-link button" id="btn-next-month">Next month</button>
              </div>
            </div>

            <!-- Weekday Headers -->
            <div class="calendar-weekdays" aria-hidden="true">
              <span>Su</span>
              <span>Mo</span>
              <span>Tu</span>
              <span>We</span>
              <span>Th</span>
              <span>Fr</span>
              <span>Sa</span>
            </div>

            <div class="calendar-grid" id="calendar-grid" role="group"></div>
          </calendar-frame-component>
          <div class="planner-legend" role="region" aria-label="Planner Legend">
            <h2 class="legend-title">Key</h2>
            <div class="legend-item">
              <span class="legend-swatch on-budget" aria-hidden="true"></span>
              <span>On Budget (&le; Daily Avg)</span>
            </div>
            <div class="legend-item">
              <span class="legend-swatch over-budget" aria-hidden="true"></span>
              <span>Over Budget (&gt; Daily Avg)</span>
            </div>
            <div class="legend-item">
              <span class="legend-unlogged" aria-hidden="true">—</span>
              <span>Not logged</span>
            </div>
          </div>
        </section>
        <section class="day-detail-box rule-section" aria-labelledby="detail-heading">
          <div class="detail-header-row">
            <h2 class="detail-heading" id="detail-heading">Selected date</h2>
            <span class="day-status-pill status-neutral" id="day-status-pill">Not Logged</span>
          </div>

          <form-field-component class="detail-field">
            <label for="plan-location">Enter where you plan to eat</label>
            <input
              type="text"
              id="plan-location"
              name="planLocation"
              class="underlined-input control"
              placeholder="e.g. The Commons"
              value=""
            />
          </form-field-component>

          <form-field-component class="detail-field">
            <label for="plan-spend">Enter what you spent / plan to spend ($)</label>
            <input
              type="number"
              id="plan-spend"
              name="planSpend"
              class="underlined-input control"
              placeholder="0.00"
              value=""
              min="0"
              step="0.01"
            />
          </form-field-component>

          <div class="detail-actions">
            <button type="button" id="btn-save-day" class="btn-save-day button button-primary">Save Day</button>
            <button type="button" id="btn-clear-day" class="btn-clear-day button">Clear</button>
            <span class="save-feedback" id="save-feedback" role="status">Saved!</span>
          </div>
        </section>
      </div>
    </main>

    <footer-component page="{{currentPage}}"></footer-component>

  </body>
</html>
