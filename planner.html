<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Planner | Your Dining Bucks Planner</title>
    <link rel="stylesheet" href="css/planner.css" />
    <script src="vendor/plain.js" defer></script>
    <script src="js/app.js" defer></script>
    <script src="js/planner.js" defer></script>
  </head>
  <body>
    <!-- Accessibility Skip Link -->
    <a class="skip-link" href="#main-content">Skip to content</a>

    <navbar-component page="{{currentPage}}"></navbar-component>

    <!-- Main Content: Planner & John's Section -->
    <main id="main-content" tabindex="-1">
      <div class="planner-container">
        <!-- LEFT COLUMN: Budget input, Averaging metrics, Key, and Day Details with Arrow -->
        <section class="planner-left" aria-label="Planner Budget Controls">
          <!-- Enter Budget -->
          <div class="budget-input-group">
            <label for="planner-budget">Enter Budget: $</label>
            <input
              type="number"
              id="planner-budget"
              name="budget"
              class="budget-input-field"
              placeholder="0.00"
              value=""
              min="0"
              step="1"
            />
          </div>

          <!-- Averaging & Summary Metrics -->
          <div class="budget-metrics-banner" id="budget-metrics" role="region" aria-label="Budget summary">
            <div class="metric-item">
              <span class="metric-label">Daily Avg:</span>
              <span class="metric-value" id="val-daily-avg">$0.00 / day</span>
            </div>
            <div class="metric-item">
              <span class="metric-label">Total Spent:</span>
              <span class="metric-value" id="val-total-spent">$0.00</span>
            </div>
            <div class="metric-item">
              <span class="metric-label">Remaining:</span>
              <span class="metric-value" id="val-remaining">$0.00</span>
            </div>
          </div>

          <!-- Key / Legend -->
          <div class="planner-legend" role="region" aria-label="Planner Legend">
            <h2 class="legend-title">Key</h2>
            <div class="legend-item">
              <span class="legend-swatch on-budget" aria-hidden="true"></span>
              <span>On Budget (&le; Daily Avg)</span>
            </div>
            <div class="legend-item">
              <span class="legend-swatch over-budget" aria-hidden="true"></span>
              <span>Over Budget (&gt; Daily Avg)</span>
            </div>
          </div>

          <!-- Detail box for Selected Day with pointer arrow -->
          <div class="detail-box-wrapper">
            <div class="day-detail-box">
              <div class="detail-header-row">
                <p class="detail-heading" id="detail-heading">For Oct 7th:</p>
                <span class="day-status-pill status-neutral" id="day-status-pill">Not Logged</span>
              </div>
              
              <div class="detail-field">
                <label for="plan-location">Enter where you plan to eat</label>
                <input
                  type="text"
                  id="plan-location"
                  name="planLocation"
                  class="underlined-input"
                  placeholder="e.g. The Commons"
                  value=""
                />
              </div>

              <div class="detail-field">
                <label for="plan-spend">Enter what you spent / plan to spend ($)</label>
                <input
                  type="number"
                  id="plan-spend"
                  name="planSpend"
                  class="underlined-input"
                  placeholder="0.00"
                  value=""
                  min="0"
                  step="0.25"
                />
              </div>

              <div class="detail-actions">
                <button type="button" id="btn-save-day" class="btn-save-day">Save Day</button>
                <button type="button" id="btn-clear-day" class="btn-clear-day">Clear</button>
                <span class="save-feedback" id="save-feedback">Saved!</span>
              </div>
            </div>

            <!-- Arrow pointing from the detail box to the selected date on the calendar -->
            <div class="arrow-container" id="arrow-container" aria-hidden="true">
              <svg class="planner-arrow" width="58" height="24" viewBox="0 0 58 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <g id="arrow-position" class="arrow-position">
                  <path d="M0 12H52M52 12L42 4M52 12L42 20" stroke="#000000" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
                </g>
              </svg>
            </div>
          </div>
        </section>

        <!-- RIGHT COLUMN: Calendar Card & Overall Budget -->
        <section class="planner-right" aria-label="Interactive Calendar Planner">
          <div class="calendar-card">
            <!-- Month & Year Selectors -->
            <div class="calendar-header">
              <div class="calendar-select-group">
                <select id="calendar-month" class="calendar-select" aria-label="Select month">
                  <option value="Oct" selected>Oct</option>
                  <option value="Nov">Nov</option>
                  <option value="Dec">Dec</option>
                </select>

                <select id="calendar-year" class="calendar-select" aria-label="Select year">
                  <option value="2026" selected>2026</option>
                  <option value="2027">2027</option>
                </select>
              </div>
            </div>

            <!-- Weekday Headers -->
            <div class="calendar-weekdays" aria-hidden="true">
              <span>Su</span>
              <span>Mo</span>
              <span>Tu</span>
              <span>We</span>
              <span>Th</span>
              <span>Fr</span>
              <span>Sa</span>
            </div>

            <!-- 7-Column Calendar Grid matching Figma John node -->
            <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="October 2026 calendar">
              <!-- Row 1: empty Sunday, then 1 through 6 -->
              <span class="calendar-day empty" aria-hidden="true"></span>
              <button type="button" class="calendar-day" data-day="1">1</button>
              <button type="button" class="calendar-day" data-day="2">2</button>
              <button type="button" class="calendar-day" data-day="3">3</button>
              <button type="button" class="calendar-day" data-day="4">4</button>
              <button type="button" class="calendar-day" data-day="5">5</button>
              <button type="button" class="calendar-day" data-day="6">6</button>

              <!-- Row 2: 7 (selected) through 13 -->
              <button type="button" class="calendar-day day-selected" data-day="7" aria-current="date">7</button>
              <button type="button" class="calendar-day" data-day="8">8</button>
              <button type="button" class="calendar-day day-bold" data-day="9">9</button>
              <button type="button" class="calendar-day" data-day="10">10</button>
              <button type="button" class="calendar-day" data-day="11">11</button>
              <button type="button" class="calendar-day" data-day="12">12</button>
              <button type="button" class="calendar-day" data-day="13">13</button>

              <!-- Row 3: 14 through 20 -->
              <button type="button" class="calendar-day" data-day="14">14</button>
              <button type="button" class="calendar-day" data-day="15">15</button>
              <button type="button" class="calendar-day" data-day="16">16</button>
              <button type="button" class="calendar-day" data-day="17">17</button>
              <button type="button" class="calendar-day" data-day="18">18</button>
              <button type="button" class="calendar-day" data-day="19">19</button>
              <button type="button" class="calendar-day" data-day="20">20</button>

              <!-- Row 4: 21 through 27 -->
              <button type="button" class="calendar-day" data-day="21">21</button>
              <button type="button" class="calendar-day" data-day="22">22</button>
              <button type="button" class="calendar-day" data-day="23">23</button>
              <button type="button" class="calendar-day" data-day="24">24</button>
              <button type="button" class="calendar-day" data-day="25">25</button>
              <button type="button" class="calendar-day" data-day="26">26</button>
              <button type="button" class="calendar-day" data-day="27">27</button>

              <!-- Row 5: 28 through 30, followed by next month days 1 through 4 -->
              <button type="button" class="calendar-day" data-day="28">28</button>
              <button type="button" class="calendar-day" data-day="29">29</button>
              <button type="button" class="calendar-day" data-day="30">30</button>
              <span class="calendar-day day-muted" aria-label="Nov 1, Next Month">1</span>
              <span class="calendar-day day-muted" aria-label="Nov 2, Next Month">2</span>
              <span class="calendar-day day-muted" aria-label="Nov 3, Next Month">3</span>
              <span class="calendar-day day-muted" aria-label="Nov 4, Next Month">4</span>
            </div>
          </div>

          <!-- Month Navigation Links -->
          <div class="calendar-footer-nav">
            <button type="button" class="month-nav-link" id="btn-prev-month">&lt;&lt;&lt;Last Month</button>
            <button type="button" class="month-nav-link" id="btn-next-month">Next Month&gt;&gt;&gt;</button>
          </div>

          <!-- Overall Budget Callout -->
          <div class="overall-budget-wrap">
            <span>Overall budget =</span>
            <span class="overall-swatch neutral" id="overall-swatch" aria-label="Overall budget indicator"></span>
            <span class="overall-status-text" id="overall-status-text">Enter budget to track</span>
          </div>
        </section>
      </div>
    </main>

    <footer-component page="{{currentPage}}"></footer-component>

  </body>
</html>
